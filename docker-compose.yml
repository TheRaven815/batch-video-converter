services:
  app:
    image: ${APP_IMAGE:-batch-video-converter:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VIDEO_CONVERTER_STORAGE: ${VIDEO_CONVERTER_STORAGE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Avoid /data because Coolify may reserve that target for its own
      # persistent storage and hide this service's configured bind mount.
      DATA_ROOT: /app-data
      MEDIA_MOUNTS: ${MEDIA_MOUNTS:-Movies=/media/movies;Series=/media/series;Downloads=/media/downloads}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-1}
      FFMPEG_STALL_TIMEOUT_SECONDS: ${FFMPEG_STALL_TIMEOUT_SECONDS:-300}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-536870912}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10737418240}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8765}:8765"
    volumes:
      # APP_DATA_SOURCE accepts either a host path (./data) or the declared
      # app-data named volume, which is useful for Coolify/Portainer.
      - ${APP_DATA_SOURCE:-./data}:/app-data
      - ${MEDIA_MOVIES_SOURCE:-./media/movies}:/media/movies:ro
      - ${MEDIA_SERIES_SOURCE:-./media/series}:/media/series:ro
      - ${MEDIA_DOWNLOADS_SOURCE:-./media/downloads}:/media/downloads:ro
    devices:
      # Set V4L2_DEVICE=/dev/video11 on Raspberry Pi 4. The /dev/null default
      # keeps the same Compose file portable; Pi 5 uses software encoding.
      - ${V4L2_DEVICE:-/dev/null}:/dev/video11
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 10m
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}
          cpus: "${APP_CPU_LIMIT:-2.0}"
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    # Loopback-only access supports host-side diagnostics without exposing
    # unauthenticated Redis to the network.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
    restart: unless-stopped

volumes:
  app-data:
  redis-data:
